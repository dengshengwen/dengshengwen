name: Python tests

on:
  push:
    paths:
      - "us-stock-investment-analysis/**"
  pull_request:
    paths:
      - "us-stock-investment-analysis/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: us-stock-investment-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: us-stock-investment-analysis/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
